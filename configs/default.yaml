seed: 42
paths:
  pdf: sustainability-2534712-supplementary.pdf
  raw_csv: data/raw/rockburst.csv
  processed_csv: data/processed/rockburst_processed.csv
  audit_json: data/raw/parse_audit.json
  artifacts: artifacts
  traces: artifacts/traces
  models: artifacts/models
  baselines: artifacts/baselines
  examples: artifacts/examples

features:
  - sigma_theta
  - sigma_c
  - sigma_t
  - scf
  - b1
  - b2
  - wet
  - d

target: rockburst_grade
group_col: dup_group_id

cv:
  n_outer: 5
  n_inner: 3
  n_jobs: 1
  n_repeats: 5

tuning:
  # Slice 6 / M9: ≥50 Optuna trials per model family (equal budget)
  # RM11: RF leaf/features + booster subsample/L2; SVM scaled+calibrated+balanced
  n_trials: 50

ml:
  # RM10: overwritten by train from mean-fold QWK compare (argmax | median)
  decode_rule: argmax

gemini:
  planner_model: gemini-3.5-flash
  lite_model: gemini-3.5-flash
  temperature: 0.0
  max_retries: 5
  cache_dir: artifacts/planner_cache
  # gemini-3.8-flash is valid but free-tier daily quota (20 req/day) exhausted during Phase 5;
  # switched to gemini-3.5-flash to finish the ≥30-case comparison.

physics:
  # M2: source rounding (~0.006 abs) or 2% relative on SCF/B1/B2 identities
  rel_tol: 0.02
  abs_tol: 0.006
  scf_ood_threshold: 2.0
  wet_range: [0.5, 40.0]
  d_range: [50.0, 2500.0]
  # Flag σc/σt above this (row 288 pattern); listed B1 may still look plausible
  b1_implausible_max: 200.0
  # RM6: overburden σv≈γ·D; k-ratio span for σθ plausibility
  overburden_mpa_per_m: 0.027
  k_ratio_range: [0.3, 4.0]


quality:
  iqr_factor: 3.0
  # Relative tolerance on raw measured inputs (σθ, σc, σt, Wet, D when present).
  # Production 5% groups known near-copies; lower 0.5/1/2% values are sensitivity only.
  near_dup_rel_tol: 0.05

uncertainty:
  mild_eps: 0.05
  strong_eps: 0.15
  n_perturb: 20
  conformal_alpha: 0.1

routing:
  # Absolute step ceiling (safety). Ordinary routes are ~5–9 steps; must sit
  # well above the longest legitimate path so missing-D extra_validation does
  # not consume a shared step budget vs present-D (RC5).
  max_loops: 24
  # Primary non-convergence limit: completed Critic→recheck cycles (RC5).
  # Forced abstain only when this budget is exhausted with unresolved objections.
  max_critic_recheck_cycles: 3
  disagreement_threshold: 0.35
  large_set_size: 3
  # Design log (reports/design_decisions_log.md): extra validation when R_data < cut
  extra_validation_r_data: 0.55
  # Decision bands come from fusion.joblib (learned). Do not set abstain_r_final /
  # accept_r_final here — serving ignores hand-set overrides unless explicitly enabled:
  # override_decision_thresholds: true
  # abstain_r_final: 0.45
  # engineering_verification: 0.55
  # accept_with_caution: 0.65
  # accept_r_final: 0.70

fusion:
  decisions:
    - accept
    - accept_with_caution
    - engineering_verification
    - abstain
  # Confidence floor/ceiling after calibration (avoid exact 0/1 reporting)
  conf_eps: 0.001
  # RC3: null → auto Platt / beta / smoothed_isotonic by n and uniqueness.
  # Calibrator fits on full cross-fitted OOF raw scores (~344), not ~70 holdout.
  calibration_method: null
  # Decision bands: engineering_cost_utility (default) or set target_accept_rate
  # under fusion.target_accept_rate for coverage targeting + sensitivity.
  # target_accept_rate: null
  min_band_gap: 0.05
