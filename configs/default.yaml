seed: 42
paths:
  pdf: sustainability-2534712-supplementary.pdf
  raw_csv: data/raw/rockburst.csv
  processed_csv: data/processed/rockburst_processed.csv
  audit_json: data/raw/parse_audit.json
  artifacts: artifacts
  traces: artifacts/traces
  models: artifacts/models
  baselines: artifacts/baselines
  examples: artifacts/examples

features:
  - sigma_theta
  - sigma_c
  - sigma_t
  - scf
  - b1
  - b2
  - wet
  - d

target: rockburst_grade
group_col: dup_group_id

cv:
  n_outer: 5
  n_inner: 3
  n_jobs: 1
  n_repeats: 5

tuning:
  # Slice 6 / M9: ≥50 Optuna trials per model family (equal budget)
  n_trials: 50

gemini:
  planner_model: gemini-3.5-flash
  lite_model: gemini-3.5-flash
  temperature: 0.0
  max_retries: 5
  cache_dir: artifacts/planner_cache
  # gemini-3.8-flash is valid but free-tier daily quota (20 req/day) exhausted during Phase 5;
  # switched to gemini-3.5-flash to finish the ≥30-case comparison.

physics:
  # M2: source rounding (~0.006 abs) or 2% relative on SCF/B1/B2 identities
  rel_tol: 0.02
  abs_tol: 0.006
  scf_ood_threshold: 2.0
  wet_range: [0.5, 40.0]
  d_range: [50.0, 2500.0]
  # Flag σc/σt above this (row 288 pattern); listed B1 may still look plausible
  b1_implausible_max: 200.0

quality:
  iqr_factor: 3.0
  # Relative tolerance on raw measured inputs (σθ, σc, σt, Wet, D when present).
  # 1% catches Table S1 ~0.1–0.2% σθ perturbations; see dup_sensitivity.json.
  near_dup_rel_tol: 0.05

uncertainty:
  mild_eps: 0.05
  strong_eps: 0.15
  n_perturb: 20
  conformal_alpha: 0.1

routing:
  max_loops: 8
  disagreement_threshold: 0.35
  large_set_size: 3
  # Design log (reports/design_decisions_log.md): extra validation when R_data < cut
  extra_validation_r_data: 0.55
  # Decision bands come from fusion.joblib (learned). Do not set abstain_r_final /
  # accept_r_final here — serving ignores hand-set overrides unless explicitly enabled:
  # override_decision_thresholds: true
  # abstain_r_final: 0.45
  # engineering_verification: 0.55
  # accept_with_caution: 0.65
  # accept_r_final: 0.70

fusion:
  decisions:
    - accept
    - accept_with_caution
    - engineering_verification
    - abstain
  # Confidence floor/ceiling after calibration (avoid exact 0/1 reporting)
  conf_eps: 0.001
